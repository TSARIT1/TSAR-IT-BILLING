version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. MySQL 8.0 Enterprise Database
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: tsar_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: billing_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tsar_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Apache Kafka & Zookeeper Event Stream
  # -------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tsar_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - tsar_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tsar_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - tsar_network

  # -------------------------------------------------------------
  # 3. Redis 7 High-Speed In-Memory Cache
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tsar_redis
    ports:
      - "6379:6379"
    networks:
      - tsar_network

  # -------------------------------------------------------------
  # 4. Spring Boot 3.2.8 Enterprise Backend
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend/spring-backend
      dockerfile: Dockerfile
    container_name: tsar_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/billing_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - tsar_network

  # -------------------------------------------------------------
  # 5. React 18 Production Web Client + Nginx
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tsar_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - tsar_network

volumes:
  mysql_data:
    driver: local

networks:
  tsar_network:
    driver: bridge
