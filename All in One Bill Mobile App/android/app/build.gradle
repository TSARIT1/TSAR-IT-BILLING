apply plugin: 'com.android.application'

android {
    namespace "com.tsarit.billing"
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.tsarit.billing"
        minSdk 24
        targetSdk 34
        versionCode 35
        versionName "4.14.16"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("release.jks")
            storePassword "Tsarit@12345"
            keyAlias "billing"
            keyPassword "Tsarit@12345"
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // R8 shrinks + optimizes: 7.1MB → smaller dex, faster class loading.
            // GSON/OkHttp models kept via keep rules so cloud sync keeps working.
            minifyEnabled true
            shrinkResources true
            debuggable false
            manifestPlaceholders = [networkSecurityConfig: "@xml/network_security_config"]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            debuggable true
            manifestPlaceholders = [networkSecurityConfig: "@xml/network_security_config_debug"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    // Razorpay (plan checkout) + ZXing core (UPI QR generation for invoice payments)
    implementation 'com.razorpay:checkout:1.6.41'
    implementation 'com.google.zxing:core:3.5.3'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
