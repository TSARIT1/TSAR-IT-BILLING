server.port=8081

# Local-only overrides (git-ignored): create application-local.properties next to this file
# to supply your dev database password, or export SPRING_DATASOURCE_PASSWORD instead.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/billing_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:WARN}
spring.jpa.open-in-view=false

# MySQL dialect is auto-detected by Hibernate 6; specifying it explicitly is deprecated.

# JWT secret — ALWAYS override via APP_JWT_SECRET in production.
# The default below is for local development only.
app.jwtSecret=${APP_JWT_SECRET:dev-only-jwt-secret-change-me-32bytes-minimum!!}
app.jwtExpirationMs=${APP_JWT_EXPIRATION_MS:86400000}

# Razorpay Payment Gateway
# IMPORTANT: never commit real keys. Set RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET in the environment.
# The frontend only embeds the PUBLIC key id via REACT_APP_RAZORPAY_KEY_ID.
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Business name used in AI assistant and WhatsApp notification messages
# Override via BUSINESS_NAME environment variable in production
business.name=${BUSINESS_NAME:TSAR IT BILLING}

# WhatsApp Business Cloud API (Meta)
# Set these on the server; see .env.example. Webhook URL: /api/whatsapp/webhook
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:tsarit-billing-webhook}
whatsapp.otp-template=${WHATSAPP_OTP_TEMPLATE:tsar_security_code_auth}
whatsapp.otp-template-lang=${WHATSAPP_OTP_TEMPLATE_LANG:en_US}
whatsapp.default-country-code=${WHATSAPP_DEFAULT_COUNTRY_CODE:91}

# Own-SIM SMS gateway (free — phone with unlimited SMS plan does the sending)
# Optional shared secret: if set, gateway phones must send it on /register
sms.gateway.api-key=${SMS_GATEWAY_API_KEY:}
sms.gateway.poll-batch-size=${SMS_GATEWAY_BATCH:10}

# Jackson JSON Serialization
spring.jackson.serialization.fail-on-empty-beans=false
